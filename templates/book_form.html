{% extends 'base.html' %}{% block title %}{{ 'Edit book' if book else 'Add book' }}{% endblock %}{% block content %}<section class="page-heading"><div><span class="eyebrow">CATALOGUE</span><h1>{{ 'Edit book' if book else 'Add a book' }}</h1><p>Keep the bibliographic details accurate.</p></div><a class="btn btn-quiet" href="{{ url_for('manage_books') }}">← Back to books</a></section><form class="form-card wide-form" method="post"><div class="form-grid"><label>Book title<input required maxlength="200" name="title" value="{{ book.title if book else '' }}"></label><label>Author<input required maxlength="150" name="author" value="{{ book.author if book else '' }}"></label><label>ISBN<input required maxlength="32" name="isbn" value="{{ book.isbn if book else '' }}"></label><label>Category<input required maxlength="80" name="category" value="{{ book.category if book else '' }}"></label><label>Total copies<input required type="number" min="0" name="total_copies" value="{{ book.total_copies if book else 1 }}"></label></div><div class="form-actions"><a class="btn btn-quiet" href="{{ url_for('manage_books') }}">Cancel</a><button class="btn btn-primary">Save book <span>→</span></button></div></form>{% endblock %}
